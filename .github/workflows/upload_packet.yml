name: Build and Send Package

on:
  push:
    branches:
      - ci-pipeline-post
      #- feature/* 

jobs:
  build-and-send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build package
        env:
          GITHUB_REF_NAME: ${{ GITHUB_REF_NAME }}
        run: |
          mkdir -p output
          zip -r output/package_$GITHUB_REF_NAME.zip src/ docs/  # esempio di packaging

      - name: Send package to remote server
        env:
          REMOTE_URL: ${{ secrets.REMOTE_URL }}
          REMOTE_TOKEN: ${{ secrets.REMOTE_TOKEN }}
          GITHUB_REF_NAME: ${{ GITHUB_REF_NAME }}
        run: |
          curl -X POST -H "Authorization: Bearer $REMOTE_TOKEN" -F "file=@output/package_$GITHUB_REF_NAME.zip" "$REMOTE_URL/upload"
